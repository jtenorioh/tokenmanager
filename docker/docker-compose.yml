version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "7776:7776"
    environment:
      - ENV=production
    volumes:
      - ./data:/app/data
      - ~/.openclaw:/root/.openclaw:ro
    depends_on:
      - frontend
    networks:
      - tokenmanager

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "7777:7777"
    depends_on:
      - backend
    networks:
      - tokenmanager

networks:
  tokenmanager:
    driver: bridge
